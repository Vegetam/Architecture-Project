global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: order-service
    static_configs:
      - targets: ['order-service:3000']
    metrics_path: /metrics

  - job_name: payment-service
    static_configs:
      - targets: ['payment-service:3001']
    metrics_path: /metrics
